<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaDa - BD Weekly Dashboard</title>
<style>
  :root {
    --primary: #1a2b4a;
    --accent: #00c9a7;
    --accent2: #0084ff;
    --bg: #f0f4f8;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --tag-bg: #e0f2fe;
    --tag-color: #0369a1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'PingFang TC', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* ── HEADER ── */
  .header {
    background: var(--primary);
    color: #fff;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .logo span { color: var(--accent); }
  .header-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }

  .week-select {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .week-select option { background: var(--primary); color: #fff; }

  .lang-toggle { display: flex; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
  .lang-btn { padding: 7px 14px; background: transparent; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
  .lang-btn.active { background: var(--accent); color: #fff; }

  .export-btn { background: var(--accent); color: #fff; border: none; padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
  .export-btn:hover { opacity: 0.85; }

  /* ── FILTER TABS ── */
  .filter-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 32px; display: flex; gap: 4px; position: sticky; top: 61px; z-index: 90; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .filter-tab { padding: 13px 20px; border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
  .filter-tab:hover { color: var(--text); }
  .filter-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
  .tab-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── MAIN ── */
  .main { padding: 24px 32px; max-width: 1440px; margin: 0 auto; }

  /* ── SUMMARY ROW ── */
  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .summary-card { background: var(--card); border-radius: 10px; padding: 18px 20px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .s-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .s-value { font-size: 26px; font-weight: 800; color: var(--primary); }
  .s-sub { font-size: 12px; color: var(--muted); }
  .s-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 12px; width: fit-content; }
  .badge-green { background: #d1fae5; color: var(--green); }
  .badge-yellow { background: #fef3c7; color: var(--yellow); }
  .badge-red { background: #fee2e2; color: var(--red); }
  .badge-gray  { background: #f1f5f9; color: var(--muted); }

  /* ── BD GRID ── */
  .bd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .bd-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; transition: box-shadow 0.2s; }
  .bd-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

  /* ── CARD HEADER ── */
  .bd-card-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .bd-info { display: flex; align-items: center; gap: 12px; }
  .bd-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .bd-name { font-size: 16px; font-weight: 700; }
  .bd-region { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .bd-week-badge { font-size: 11px; color: var(--muted); text-align: right; }

  /* ── TDAB BANNER ── */
  .tdab-banner {
    background: linear-gradient(135deg, #1a2b4a 0%, #243b6e 100%);
    color: #fff;
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .tdab-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .tdab-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.55); }
  .tdab-main { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
  .tdab-num { font-size: 32px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
  .tdab-unit { font-size: 13px; color: rgba(255,255,255,0.65); }
  .tdab-wow { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .wow-badge { font-size: 18px; font-weight: 800; padding: 4px 10px; border-radius: 8px; }
  .wow-green { background: rgba(16,185,129,0.2); color: #6ee7b7; }
  .wow-red   { background: rgba(239,68,68,0.2);  color: #fca5a5; }
  .wow-gray  { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
  .wow-label { font-size: 10px; color: rgba(255,255,255,0.4); }
  .tdab-estimated { font-size: 10px; color: rgba(255,165,0,0.8); font-style: italic; }

  /* Sub-region breakdown */
  .tdab-sub { display: grid; gap: 6px; }
  .sub-row { display: flex; align-items: center; gap: 8px; }
  .sub-name { font-size: 11px; color: rgba(255,255,255,0.6); width: 88px; flex-shrink: 0; }
  .sub-bar-wrap { flex: 1; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .sub-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.5s ease; }
  .sub-val { font-size: 12px; font-weight: 700; color: #fff; width: 70px; text-align: right; flex-shrink: 0; }
  .sub-wow { font-size: 10px; width: 48px; text-align: right; flex-shrink: 0; }
  .sub-wow.pos { color: #6ee7b7; }
  .sub-wow.neg { color: #fca5a5; }
  .sub-wow.neu { color: rgba(255,255,255,0.4); }

  /* ── SECTION ── */
  .section { border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section-header { padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; transition: background 0.15s; }
  .section-header:hover { background: #f8fafc; }
  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .chevron { font-size: 11px; color: var(--muted); transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }
  .section-body { padding: 4px 20px 16px; display: none; }
  .section-body.open { display: block; }

  /* ── KPI ROW ── */
  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 4px; }
  .kpi-item { background: #f8fafc; border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border); }
  .kpi-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .kpi-val { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .kpi-target { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .progress-bar { height: 4px; background: #e2e8f0; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
  .kpi-green { color: var(--green); }
  .kpi-yellow { color: var(--yellow); }
  .kpi-red { color: var(--red); }

  /* ── LISTS ── */
  ul.bd-list { list-style: none; padding: 0; }
  ul.bd-list li { padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; display: flex; align-items: flex-start; gap: 8px; line-height: 1.5; }
  ul.bd-list li:last-child { border-bottom: none; }
  ul.bd-list li::before { content: '›'; color: var(--accent); font-weight: 700; flex-shrink: 0; margin-top: 1px; }

  /* ── TAGS ── */
  .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; margin: 2px; }
  .tag-blue   { background: #dbeafe; color: #1d4ed8; }
  .tag-green  { background: #d1fae5; color: #065f46; }
  .tag-orange { background: #fef3c7; color: #92400e; }
  .tag-red    { background: #fee2e2; color: #991b1b; }
  .tag-purple { background: #ede9fe; color: #5b21b6; }
  .tag-gray   { background: #f1f5f9; color: #475569; }

  /* ── CLIENT TABLE ── */
  .client-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .client-table th { background: #f8fafc; padding: 6px 10px; text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; }
  .client-table td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; }
  .client-table tr:last-child td { border-bottom: none; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }

  .hidden { display: none !important; }

  /* ── FOOTER ── */
  .last-updated { text-align: center; font-size: 11px; color: var(--muted); padding: 16px; border-top: 1px solid var(--border); margin-top: 8px; }

  /* ── PRINT ── */
  @media print {
    .header, .filter-bar { position: static; }
    .export-btn, .lang-toggle, .week-select { display: none; }
    .section-body { display: block !important; }
    .bd-grid { grid-template-columns: 1fr; }
    .summary-row { grid-template-columns: repeat(2, 1fr); }
    body { background: #fff; }
    .bd-card { break-inside: avoid; }
    .tdab-banner { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

//  HELPERS
// ══════════════════════════════════════════════════
function fmtTHB(n) {
  if (!n && n !== 0) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(3).replace(/\.?0+$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  return n.toLocaleString();
}

function fmtWoW(wow, lang) {
  if (wow === null || wow === undefined) return lang === 'zh' ? '— (無前期數據)' : '— (no prior data)';
  const sign = wow >= 0 ? '+' : '';
  return sign + wow.toFixed(2) + '%';
}

function wowClass(wow) {
  if (wow === null || wow === undefined) return 'wow-gray';
  if (wow > 0) return 'wow-green';
  if (wow < 0) return 'wow-red';
  return 'wow-gray';
}

function dotColor(wow) {
  if (wow === null || wow === undefined) return '#94a3b8';
  if (wow > 0) return '#10b981';
  if (wow < 0) return '#ef4444';
  return '#94a3b8';
}

function t(obj) { return obj[currentLang] || obj['zh'] || ''; }

//  RENDER TDAB BANNER
// ══════════════════════════════════════════════════
function renderTdabBanner(memberId, mData, weekEst) {
  const el = document.getElementById('tdab-banner-label-' + memberId) || document.getElementById('tdab-' + memberId);
  if (!el) return;

  const isEst  = weekEst || mData.estimated;
  const totalPct = mData.subRegions.reduce((s, r) => s + r.tdab, 0);

  let subHtml = '';
  mData.subRegions.forEach(r => {
    const pct = totalPct > 0 ? (r.tdab / totalPct * 100) : 0;
    const wowStr = fmtWoW(r.wow, currentLang);
    const wc = r.wow > 0 ? 'pos' : r.wow < 0 ? 'neg' : 'neu';
    subHtml += `
      <div class="sub-row">
        <div class="sub-name">${currentLang === 'zh' ? r.nameZh : r.nameEn}</div>
        <div class="sub-bar-wrap"><div class="sub-bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="sub-val">${fmtTHB(r.tdab)}</div>
        <div class="sub-wow ${wc}">${r.wow !== null && r.wow !== undefined ? (r.wow >= 0 ? '+' : '') + r.wow.toFixed(1) + '%' : '—'}</div>
      </div>`;
  });

  const wowVal   = fmtWoW(mData.tdabWoW, currentLang);
  const wowCls   = wowClass(mData.tdabWoW);
  const labelZh  = '日均押注 (TDAB)';
  const labelEn  = 'Daily Avg Bet (TDAB)';
  const subLabelZh = currentLang === 'zh' ? '本週較上週' : 'Week-over-Week';

  el.innerHTML = `
    <div class="tdab-top">
      <div>
        <div class="tdab-label">${currentLang === 'zh' ? labelZh : labelEn}</div>
        <div class="tdab-main">
          <div class="tdab-num">${fmtTHB(mData.tdab)}</div>
          <div class="tdab-unit">THB / ${currentLang === 'zh' ? '天' : 'day'}</div>
        </div>
        ${isEst ? `<div class="tdab-estimated">⚠ ${currentLang === 'zh' ? '推估值，非官方報告' : 'Estimated — not from official report'}</div>` : ''}
      </div>
      <div class="tdab-wow">
        <div class="wow-badge ${wowCls}">${wowVal}</div>
        <div class="wow-label">${subLabelZh}</div>
      </div>
    </div>
    ${mData.subRegions.length > 1 ? `<div class="tdab-sub">${subHtml}</div>` : ''}
  `;
}

                 : s.teamWoWClass === 'red'   ? 'badge-red'
                 : 'badge-gray';

  const lbl1 = currentLang === 'zh' ? '本週總日均押注' : 'Weekly Total TDAB';
  const lbl2 = currentLang === 'zh' ? '整體 WoW 成長' : 'Team WoW Growth';
  const lbl3 = currentLang === 'zh' ? 'BD 成員數'      : 'BD Members';
  const lbl4 = currentLang === 'zh' ? '週期'           : 'Period';
  const note = currentLang === 'zh' ? s.noteZh : s.noteEn;
  const estBadge = wData.estimated ? (currentLang === 'zh' ? ' (推估)' : ' (Est.)') : '';

  const wowDisplay = (typeof s.teamWoW === 'object') ? t(s.teamWoW) : s.teamWoW;
  const wowArrow   = s.teamWoWClass === 'green' ? '↑' : s.teamWoWClass === 'red' ? '↓' : '—';

  el.innerHTML = `
    <div class="summary-card">
      <div class="s-label">${lbl1}</div>
      <div class="s-value">${t(s.totalTDAB)}${estBadge}</div>
      <div class="s-sub">${note}</div>
    </div>
    <div class="summary-card">
      <div class="s-label">${lbl2}</div>
      <div class="s-value">${wowDisplay}</div>
      <div class="s-badge ${badgeCls}">${wowArrow} WoW</div>
    </div>
    <div class="summary-card">
      <div class="s-label">${lbl3}</div>
      <div class="s-value">4</div>
      <div class="s-sub">Bryam · Hector · Chu · Nina</div>
    </div>
    <div class="summary-card">
      <div class="s-label">${lbl4}</div>
      <div class="s-value" style="font-size:16px;padding-top:4px">${t(wData.period)}</div>
      <div class="s-badge badge-gray">${t(wData.label)}</div>
    </div>
  `;
}

// ══════════════════════════════════════════════════
//  RENDER PERIOD BADGE on each card header
// ══════════════════════════════════════════════════
function renderPeriods(wData) {
  const members = ['bryam', 'hector', 'chu', 'nina'];
  const regionMap = {
    bryam:  { zh: 'CIS &amp; 西亞', en: 'CIS &amp; West Asia' },
    hector: { zh: 'LATAM',          en: 'LATAM' },
    chu:    { zh: '非洲 &amp; 大洋洲 &amp; 北美', en: 'Africa &amp; Oceania &amp; N. America' },
    nina:   { zh: 'EU 監管 &amp; EU+Global',      en: 'EU Regulated &amp; EU+Global' }
  };
  members.forEach(m => {
    const periodEl = document.getElementById(m + '-period');
    const regionEl = document.getElementById(m + '-region');
    if (periodEl) periodEl.textContent = t(wData.period);
    if (regionEl) regionEl.innerHTML = t(regionMap[m]);
  });
}

// ══════════════════════════════════════════════════
//  RENDER WEEK  (main entry point)
// ══════════════════════════════════════════════════
function renderWeek(weekId) {
  currentWeek = weekId;
  const wData = weekData[weekId];
  if (!wData) return;

  renderSummary(wData);
  renderPeriods(wData);

  const members = ['bryam', 'hector', 'chu', 'nina'];
  members.forEach(m => {
    const mData = wData.members[m];
    renderTdabBanner(m, mData, wData.estimated);
    renderSections(m, mData);
  });

  // Update footer
  const footerEl = document.getElementById('footer-note');
  if (footerEl) {
    const estNote = wData.estimated
      ? (currentLang === 'zh' ? ' · ⚠ 本週為推估值' : ' · ⚠ This week is estimated')
      : '';
    footerEl.textContent = currentLang === 'zh'
      ? `📅 資料來源：Google Drive BD Weekly Reports · 2026年3月${estNote}`
      : `📅 Data source: Google Drive BD Weekly Reports · March 2026${estNote}`;
  }
}

// ══════════════════════════════════════════════════
//  SWITCH WEEK  (called by <select>)
// ══════════════════════════════════════════════════
function switchWeek(weekId) {
  renderWeek(weekId);
}

// ══════════════════════════════════════════════════
//  LANGUAGE TOGGLE
// ══════════════════════════════════════════════════
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');

  document.getElementById('hdr-sub').textContent = lang === 'zh'
    ? 'BD 團隊 — 週報 Dashboard'
    : 'BD Team — Weekly Report Dashboard';
  document.getElementById('btn-export').textContent = lang === 'zh' ? '匯出 PDF' : 'Export PDF';
  document.getElementById('tab-all').textContent = lang === 'zh' ? '全部成員' : 'All Members';

  // Re-render current week with new language
  renderWeek(currentWeek);
}

// ══════════════════════════════════════════════════
//  BD FILTER
// ══════════════════════════════════════════════════
function filterBD(bd, btn) {
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const cards = document.querySelectorAll('.bd-card');
  const grid  = document.getElementById('bdGrid');

  if (bd === 'all') {
    cards.forEach(c => c.classList.remove('hidden'));
    grid.style.gridTemplateColumns = '';
  } else {
    cards.forEach(c => {
      c.classList.toggle('hidden', c.getAttribute('data-bd') !== bd);
    });
    grid.style.gridTemplateColumns = '1fr';
  }
}

// ══════════════════════════════════════════════════
//  SECTION TOGGLE
// ══════════════════════════════════════════════════
function toggleSection(header) {
  const body    = header.nextElementSibling;
  const chevron = header.querySelector('.chevron');
  const isOpen  = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  if (chevron) chevron.classList.toggle('open', !isOpen);
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  renderWeek('w12');
});
</script>
